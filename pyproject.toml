[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-webmcp-guard"
version = "0.1.0"
description = "Permission-aware WebMCP capabilities for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "jsonschema>=4.21,<5",
  "websocket-client>=1.7,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.entry-points."hermes_agent.plugins"]
hermes-webmcp-guard = "hermes_webmcp_guard:register"

[tool.setuptools.packages.find]
include = ["hermes_webmcp_guard*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: requires a real WebMCP-capable browser endpoint"]

